name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'apps/web/src/app/globals*.css'
      - 'apps/web/src/app/icon.svg'
      - 'docs/assets/screenshots/alpha/**'
      - 'docs/demo/**'
      - 'scripts/build-pages-demo.mjs'
      - 'scripts/verify-pages-demo.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'apps/web/src/app/globals*.css'
      - 'apps/web/src/app/icon.svg'
      - 'docs/assets/screenshots/alpha/**'
      - 'docs/demo/**'
      - 'scripts/build-pages-demo.mjs'
      - 'scripts/verify-pages-demo.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20.19.0

      - name: Build static demo
        run: node ./scripts/build-pages-demo.mjs

      - name: Verify static artifact
        run: node ./scripts/verify-pages-demo.mjs

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages-demo

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
